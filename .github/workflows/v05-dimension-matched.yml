name: Origins-DNA v0.7 LaTeX/PDF materializer

on:
  push:
    branches:
      - research/origins-dna-v0.7-null-calibrated-contrast
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/origins-dna-v0.7-null-calibrated-contrast
          fetch-depth: 0
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
      - name: Compile deterministic preregistration PDF
        env:
          SOURCE_DATE_EPOCH: "1784160000"
          FORCE_SOURCE_DATE: "1"
          TZ: UTC
        run: |
          cd latex
          pdflatex -interaction=nonstopmode -halt-on-error null_calibrated_contrast_preregistration.tex
          pdflatex -interaction=nonstopmode -halt-on-error null_calibrated_contrast_preregistration.tex
          ! grep -E "(LaTeX Warning|undefined references|Overfull|Underfull)" null_calibrated_contrast_preregistration.log
          test "$(sha256sum null_calibrated_contrast_preregistration.tex | cut -d' ' -f1)" = "f403a1ba2608a501d635baad9a0aa7f6adc0fa042503f2abfa8102647b3a1559"
          test "$(sha256sum null_calibrated_contrast_preregistration.pdf | cut -d' ' -f1)" = "61178932cbf39fb053a36a0db6bf52cde9ce18e7bfd391dd004898ff2dfc0c00"
      - name: Append LaTeX/PDF provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          log_path = Path("logs/changes.jsonl")
          note_path = Path("notes/LEGACY_NOTES.md")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          record = {
              "schema": "origins-dna.change.v1",
              "sequence": 16,
              "date": "2026-07-16",
              "branch": "research/origins-dna-v0.7-null-calibrated-contrast",
              "parent_commit": head,
              "change_type": "clean_latex_and_deterministic_pdf_preregistration_report",
              "scope": [
                  "latex/null_calibrated_contrast_preregistration.tex",
                  "latex/null_calibrated_contrast_preregistration.pdf",
                  "logs/changes.jsonl",
                  "notes/LEGACY_NOTES.md"
              ],
              "rationale": "Add the missing reviewable LaTeX source and compiled PDF counterpart for the already frozen v0.7 preregistration before any default v0.7 result execution.",
              "result_status": "default_v0.7_result_not_executed",
              "verification": {
                  "latex_engine": "pdflatex",
                  "latex_passes": 2,
                  "latex_warnings": 0,
                  "latex_layout_defects": 0,
                  "rendered_pages_checked_locally": 3,
                  "tex_sha256": "f403a1ba2608a501d635baad9a0aa7f6adc0fa042503f2abfa8102647b3a1559",
                  "pdf_sha256": "61178932cbf39fb053a36a0db6bf52cde9ce18e7bfd391dd004898ff2dfc0c00",
                  "deterministic_source_date_epoch": 1784160000
              },
              "provenance": "LaTeX authored and locally rendered by ChatGPT; deterministic PDF independently compiled and hash-verified by GitHub Actions before commit.",
              "epistemic_status": "verified_preregistration_documentation_only",
              "destructive": False,
              "append_only_policy": "Sequences 1 through 15 are retained byte-for-byte; this documentation correction is appended as sequence 16."
          }
          lines = log_path.read_text(encoding="utf-8").splitlines()
          if not any('"sequence":16' in line for line in lines):
              with log_path.open("a", encoding="utf-8", newline="") as stream:
                  stream.write(json.dumps(record, separators=(",", ":"), ensure_ascii=False) + "\n")

          heading = "## NOTE-0015 — 2026-07-16 — v0.7 clean LaTeX and deterministic PDF"
          note = (
              "\n\n" + heading + "\n\n"
              "The first frozen v0.7 preregistration state contained the Markdown protocol, code, tests and append-only "
              "records but omitted the corresponding reviewable LaTeX source and compiled PDF. The omission was "
              "identified before execution of the default v0.7 result.\n\n"
              "`latex/null_calibrated_contrast_preregistration.tex` now records the frozen schedules, estimands, "
              "uncertainty procedures, decision rule, control diagnostics and epistemic boundary. It compiles twice "
              "without warnings or layout defects. The three rendered pages were inspected locally for clipping, overlap "
              "and broken glyphs. The committed PDF is reproducible under `SOURCE_DATE_EPOCH=1784160000` and has "
              "SHA-256 `61178932cbf39fb053a36a0db6bf52cde9ce18e7bfd391dd004898ff2dfc0c00`. No v0.7 result was executed or interpreted during this correction.\n"
          )
          existing = note_path.read_text(encoding="utf-8")
          if heading not in existing:
              with note_path.open("a", encoding="utf-8", newline="") as stream:
                  stream.write(note)
          PY
      - name: Commit PDF and append-only records
        run: |
          git config user.name "Origins-DNA provenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add latex/null_calibrated_contrast_preregistration.pdf logs/changes.jsonl notes/LEGACY_NOTES.md
          if git diff --cached --quiet; then
            echo "LaTeX/PDF provenance already materialized"
          else
            git commit -m "docs: add deterministic v0.7 preregistration PDF"
            git push origin HEAD:research/origins-dna-v0.7-null-calibrated-contrast
          fi
