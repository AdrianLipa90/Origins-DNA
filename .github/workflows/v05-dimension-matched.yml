name: Origins-DNA v0.7 preregistration materializer

on:
  push:
    branches:
      - research/origins-dna-v0.7-null-calibrated-contrast

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/origins-dna-v0.7-null-calibrated-contrast
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Decode and run frozen materializer
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          encoded = Path(".v07_payload/07_materialize.b64").read_text().strip()
          Path("/tmp/v07_materialize.py").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/v07_materialize.py
      - name: Validate preregistration implementation
        run: |
          python -m compileall -q src scripts
          python -m pip install -e ".[test]"
          pytest -q tests/test_null_calibration.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          records = [json.loads(line) for line in Path("logs/changes.jsonl").read_text(encoding="utf-8").splitlines()]
          assert [record["sequence"] for record in records] == list(range(1, 16))
          assert records[-1]["result_status"] == "not_observed_at_preregistration"
          assert hashlib.sha256(Path("src/origins_dna/null_calibration.py").read_bytes()).hexdigest() == "7f2336300edd4907cb2758004d2023f4d85840fb2a92d3c735787e0911e6303e"
          assert hashlib.sha256(Path("tests/test_null_calibration.py").read_bytes()).hexdigest() == "dde667b29312dc0e96ce904027072ece102ff51793936b1a1fe9e3da9d7a932c"
          PY
      - name: Commit frozen preregistration
        run: |
          git config user.name "Origins-DNA provenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/NULL_CALIBRATED_PROTOCOL.md logs/changes.jsonl notes/LEGACY_NOTES.md \
            scripts/run_null_calibrated_contrast.py src/origins_dna/__init__.py \
            src/origins_dna/benchmark.py src/origins_dna/null_calibration.py \
            tests/test_null_calibration.py
          if git diff --cached --quiet; then
            echo "Preregistration already materialized"
          else
            git commit -m "feat: freeze v0.7 independent null-calibrated analysis"
            git push origin HEAD:research/origins-dna-v0.7-null-calibrated-contrast
          fi
