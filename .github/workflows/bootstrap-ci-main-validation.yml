name: Bootstrap main validation correction

on:
  push:
    branches:
      - agent/ci-main-validation-stage

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ci-main-validation-stage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply append-only process correction
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          workflow = '''name: Origins-DNA validation

          on:
            push:
              branches:
                - main
                - "research/**"
                - "agent/**"
            pull_request:
              paths:
                - "src/**"
                - "tests/**"
                - "scripts/**"
                - "latex/**"
                - "docs/**"
                - "results/**"
                - "README.md"
                - "pyproject.toml"
                - ".github/workflows/v05-dimension-matched.yml"

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                    cache: pip
                - name: Install package
                  run: python -m pip install -e ".[test]"
                - name: Run full test suite
                  run: pytest -q
                - name: Compile Python
                  run: python -m compileall -q src scripts
                - name: Reproduce v0.5 deterministic benchmark
                  run: |
                    mkdir -p artifacts
                    python scripts/run_dimension_matched_benchmark.py \\
                      --output artifacts/v0.5_dimension_matched_benchmark.json
                - name: Compile all LaTeX reports
                  run: |
                    if compgen -G "latex/*.tex" > /dev/null; then
                      sudo apt-get update
                      sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
                      mkdir -p artifacts/latex
                      for source in latex/*.tex; do
                        pdflatex -interaction=nonstopmode -halt-on-error -output-directory=artifacts/latex "$source"
                        pdflatex -interaction=nonstopmode -halt-on-error -output-directory=artifacts/latex "$source"
                        log="artifacts/latex/$(basename "${source%.tex}").log"
                        ! grep -E "(LaTeX Warning|undefined references|Overfull|Underfull)" "$log"
                      done
                    fi
                - name: Upload validation artifacts
                  uses: actions/upload-artifact@v4
                  with:
                    name: origins-dna-validation-results
                    path: |
                      artifacts/v0.5_dimension_matched_benchmark.json
                      artifacts/v0.5_dimension_matched_benchmark.json.gz
                      artifacts/v0.5_dimension_matched_benchmark_summary.json
                      artifacts/v0.5_dimension_matched_benchmark_comparisons.json
                      artifacts/latex/*.pdf
                    if-no-files-found: error
          '''
          # Remove indentation inherited from this bootstrap source.
          workflow = "\n".join(line[10:] if line.startswith("          ") else line for line in workflow.splitlines()) + "\n"
          Path(".github/workflows/v05-dimension-matched.yml").write_text(workflow, encoding="utf-8")

          log_path = Path("logs/changes.jsonl")
          existing_log = log_path.read_text(encoding="utf-8")
          records = [json.loads(line) for line in existing_log.splitlines() if line.strip()]
          sequences = [record["sequence"] for record in records]
          if sequences != list(range(1, 13)):
              raise SystemExit(f"unexpected legacy sequence prefix: {sequences}")
          if any(record.get("sequence") == 13 for record in records):
              raise SystemExit("sequence 13 already exists")
          sequence_13 = {
              "schema": "origins-dna.change.v1",
              "sequence": 13,
              "date": "2026-07-15",
              "branch": "agent/ci-main-validation",
              "parent_commit": "3819f9e1b04f540b018756c7f3fe7691193b728e",
              "change_type": "ci_main_validation_scope_correction",
              "scope": [
                  ".github/workflows/v05-dimension-matched.yml",
                  "logs/changes.jsonl",
                  "notes/LEGACY_NOTES.md",
              ],
              "rationale": "Ensure the default branch and future research or agent branches receive direct GitHub Actions validation after the audit found that the workflow push trigger covered only the v0.5 research branch.",
              "detected_problem": "The final main tree was byte-equivalent to the validated v0.6 head, but the main merge commit had no workflow run because push validation was restricted to research/origins-dna-v0.5-dimension-matched.",
              "resolution": "Rename the workflow generically, validate pushes to main, research/** and agent/**, broaden pull-request path coverage to documentation and result provenance, and compile every LaTeX report rather than only the v0.5 note.",
              "history_policy": "Do not rewrite the existing merge history; record the process correction forward-only.",
              "result_status": "workflow_change_committed_pending_pull_request_ci",
              "provenance": "Implemented by ChatGPT through the connected GitHub app after Adrian Lipa explicitly approved the correction as the next commit.",
              "epistemic_status": "process_hygiene_and_ci_scope_correction",
              "destructive": False,
              "append_only_policy": "Sequences 1 through 12 are retained byte-for-byte; this process correction is appended as sequence 13.",
          }
          prefix = existing_log if existing_log.endswith("\n") else existing_log + "\n"
          log_path.write_text(prefix + json.dumps(sequence_13, separators=(",", ":")) + "\n", encoding="utf-8")

          notes_path = Path("notes/LEGACY_NOTES.md")
          existing_notes = notes_path.read_text(encoding="utf-8")
          if "## NOTE-0012" in existing_notes:
              raise SystemExit("NOTE-0012 already exists")
          note = '''## NOTE-0012 — 2026-07-15 — direct validation for main

          The post-merge audit found that `main` contained the same file tree as the final validated v0.6 head, but the merge commit itself had no GitHub Actions run. The existing workflow triggered pushes only on `research/origins-dna-v0.5-dimension-matched`, so later merges into `main` were not independently checked.

          The workflow is generalized forward-only: pushes to `main`, `research/**` and `agent/**` are validated; pull-request path coverage includes source, tests, scripts, LaTeX, protocols, results, README and package metadata; and every LaTeX report is compiled twice and checked for warnings or layout defects. The historical merge graph is retained unchanged rather than rewritten.
          '''
          note = "\n".join(line[10:] if line.startswith("          ") else line for line in note.splitlines()) + "\n"
          notes_prefix = existing_notes.rstrip("\n") + "\n\n"
          notes_path.write_text(notes_prefix + note, encoding="utf-8")

          # Validate the new append-only state before committing.
          final_records = [json.loads(line) for line in log_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if [record["sequence"] for record in final_records] != list(range(1, 14)):
              raise SystemExit("append-only sequence verification failed")
          PY

          rm .github/workflows/bootstrap-ci-main-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v05-dimension-matched.yml logs/changes.jsonl notes/LEGACY_NOTES.md .github/workflows/bootstrap-ci-main-validation.yml
          git commit -m "ci: validate main and record process correction"
          git push origin HEAD:agent/ci-main-validation-stage
